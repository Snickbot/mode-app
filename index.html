<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODE — Choose How You Show Up</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main id="app">
  <section class="screen active" id="screen-landing">
    <div class="landing-hero">
      <h1 class="logo">MODE</h1>
      <h2 class="tagline">Choose how you show up.</h2>
      <p class="sub">Practice the way you speak, move, communicate, and present yourself.</p>
      <button class="btn-primary" id="btn-start">BUILD MY MODE</button>
    </div>

    <div class="landing-example">
      <div class="example-step">
        <span class="label">BEFORE</span>
        <p>"Talks too quickly"</p>
      </div>
      <div class="arrow">↓</div>
      <div class="example-step">
        <span class="label">PRACTICE</span>
        <p>20-second slow-speaking exercise</p>
      </div>
      <div class="arrow">↓</div>
      <div class="example-step">
        <span class="label">AFTER</span>
        <p>More deliberate delivery</p>
      </div>
      <p class="disclaimer">This is practice, not a guaranteed transformation.</p>
    </div>
  </section>
</main>

<script src="assets/app.js"></script>
</body>
  </html>
